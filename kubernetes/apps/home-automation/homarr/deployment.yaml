kind: Deployment
apiVersion: apps/v1
metadata:
  name: homarr
  labels:
    app: homarr

spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr

    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: homarr
          # Pinned to a digest, not a version tag, and deliberately to an older
          # build: this is the exact image that was running before the move off
          # :latest, verified working against the NFS volume.
          #
          # Homarr >= v1.77 cannot start on this volume. Its entrypoint runs
          #   chown 1000:1000 /appdata
          # unconditionally under `set -e` whenever PUID/PGID are non-zero, and
          # the NFS export root-squashes, so the chown returns EPERM and the
          # container aborts:
          #   chown: /appdata: Operation not permitted
          # /appdata is already 1000:10 mode 0777, so the chown is pointless
          # here, but there is no flag to skip it. Setting PUID/PGID to 0 would
          # skip the block at the cost of running as root, and dropping to a
          # non-root user without the chown breaks nginx's own runtime dirs.
          # Upgrading needs that ownership question settled first — see the
          # README — so the version is frozen rather than drifting.
          # renovate: datasource=docker depName=ghcr.io/homarr-labs/homarr
          image: ghcr.io/homarr-labs/homarr@sha256:ae875bfbcfd6d5cb5d9f40ba656920373c058d73ca3f360d2ffea835c7b76fa9

          ports:
            - name: homarr
              containerPort: 7575

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Stockholm"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-encryption-key
                  key: SECRET_ENCRYPTION_KEY

          volumeMounts:
            - name: homelab-storage
              mountPath: /appdata
              subPath: homarr/appdata

          securityContext:
            privileged: true

          resources:
            limits:
              cpu: 800m
              memory: 800Mi
            requests:
              cpu: 400m
              memory: 600Mi

      volumes:
        - name: homelab-storage
          persistentVolumeClaim:
            claimName: homelab-nfs-pvc
