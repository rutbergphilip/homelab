# Vanilla Minecraft server, run as a plain Deployment rather than through a
# control panel like CubeCoders AMP: AMP's controller has to create sibling
# containers, which means handing something a Docker socket — the opposite of
# what Talos + Flux buy us here. One server is one Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: default
  labels:
    app: minecraft
spec:
  replicas: 1
  # Recreate, never RollingUpdate. Two servers writing one world directory
  # corrupts region files; the old pod must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minecraft
          # renovate: datasource=docker depName=itzg/minecraft-server
          image: itzg/minecraft-server:2026.9.1-java21

          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP

          env:
            # Mojang requires explicit EULA acceptance; the server refuses to
            # start without it. https://www.minecraft.net/eula
            - name: EULA
              value: "TRUE"
            - name: TZ
              value: "Europe/Stockholm"

            # VANILLA keeps redstone and farm mechanics exactly as upstream.
            # Switch TYPE to PAPER for markedly better performance and plugin
            # support, at the cost of subtle vanilla-parity differences.
            - name: TYPE
              value: "VANILLA"

            # Pinned on purpose: clients must run a matching version, so the
            # server version is a decision, not something to drift with LATEST.
            - name: VERSION
              value: "26.3"

            # Heap. Keep this comfortably below the container memory limit —
            # the JVM needs headroom beyond the heap for metaspace and GC.
            - name: MEMORY
              value: "4G"

            - name: MAX_PLAYERS
              value: "10"
            - name: DIFFICULTY
              value: "normal"
            - name: MOTD
              value: "Rutberg homelab"

            # Keep the whitelist authoritative: the server is reachable from
            # the LAN and the tailnet, and an open server on either is an
            # invitation. Add gamertags to WHITELIST (comma-separated) and set
            # OPS to the accounts that should have operator rights.
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            - name: WHITELIST
              value: ""
            - name: OPS
              value: ""

            # Online mode verifies players against Mojang's auth servers.
            # Never set this to FALSE on a network anything else can reach.
            - name: ONLINE_MODE
              value: "TRUE"

            # The image runs `rcon-cli` internally for a graceful stop; the
            # password never leaves the pod (no RCON port is published).
            - name: ENABLE_RCON
              value: "TRUE"

          # The image ships mc-health, which speaks the server's own status
          # protocol. Startup is slow on first run (world generation), so the
          # startup probe gets a long budget while liveness stays tight.
          startupProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # Generous terminationGracePeriod so the world is flushed to disk on
          # shutdown rather than being killed mid-save.
          resources:
            limits:
              memory: 6Gi
              cpu: "4"
            requests:
              memory: 4Gi
              cpu: "1"

          volumeMounts:
            - name: homelab-storage
              mountPath: /data
              subPath: minecraft/data

      terminationGracePeriodSeconds: 120

      volumes:
        - name: homelab-storage
          persistentVolumeClaim:
            claimName: homelab-nfs-pvc
