# Scrape the Flux controllers (gotk_* metrics) so the Flux dashboards in Grafana and the
# homelab:cluster_flux_failing recording rule have data. Same shape as the upstream
# fluxcd/flux2-monitoring-example PodMonitor; lives here because this app owns the
# Prometheus that picks it up (podMonitorSelector: {}).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
spec:
  namespaceSelector:
    matchNames: [flux-system]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [helm-controller, source-controller, kustomize-controller, notification-controller, image-automation-controller, image-reflector-controller]
  podMetricsEndpoints:
    - port: http-prom
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_phase]
          action: keep
          regex: Running
