# nas/torrent-vpn/compose.yaml
# Deployed as UGOS Docker "Project" torrent-vpn on the Ugreen NAS (192.168.50.254).
# Spec: docs/superpowers/specs/2026-09-04-nas-torrent-vpn-gluetun-design.md
name: torrent-vpn

# Bounded container logs (docker default is unlimited json-file on the SSD volume).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: torrent-vpn-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - starrs
    ports:
      # qBittorrent WebUI (cutover done 2026-09-07; 38081 was the side-by-side port).
      - "38080:8080"
    environment:
      # Replace ONLY in the UGOS project editor (the pasted copy lives on the NAS,
      # never in git). PrivateKey from a Proton WireGuard config with NAT-PMP on.
      WIREGUARD_PRIVATE_KEY: REPLACE_ME
      TZ: Europe/Stockholm
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      SERVER_COUNTRIES: Sweden
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      # Push Proton's forwarded port into qBittorrent (needs "Bypass authentication
      # for clients on localhost" enabled in qBittorrent WebUI options).
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      # LAN, cluster pod CIDR, docker bridge — same as the old LAN_NETWORK.
      FIREWALL_OUTBOUND_SUBNETS: 192.168.50.0/24,10.42.0.0/16,172.18.0.0/16
      # HTTP proxy over the tunnel for Prowlarr (torrent-vpn-gluetun:8888 on the
      # starrs network only — deliberately not published to the LAN). Replaces
      # the old container's Privoxy on :8118.
      HTTPPROXY: "on"
      # media-janitor (below) listens on :9797 inside this network namespace; the
      # arrs reach it as torrent-vpn-gluetun:9797 on the starrs network. Not published.
      FIREWALL_INPUT_PORTS: "9797"
      UPDATER_PERIOD: 24h
      HEALTH_VPN_DURATION_INITIAL: 30s
    volumes:
      - /volume2/nas-apps/torrent-vpn/gluetun:/gluetun
    logging: *logging
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3-libtorrentv1
    container_name: torrent-vpn-qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: Europe/Stockholm
      PUID: "1000"
      PGID: "10"
      UMASK: "002"
      WEBUI_PORT: "8080"
    volumes:
      - /volume2/nas-apps/torrent-vpn/qbittorrent:/config
      - /volume1/homelab/streaming/torrents:/torrents
    logging: *logging
    restart: unless-stopped

  # Single-point media removal (nas/media-janitor/README.md). Shares gluetun's
  # network namespace so it can talk to qBittorrent on 127.0.0.1 with the
  # "bypass authentication for localhost" rule — no password anywhere. Radarr and
  # Sonarr post their delete webhooks to http://torrent-vpn-gluetun:9797/arr.
  media-janitor:
    image: python:3.12-alpine
    container_name: media-janitor
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    command: ["python3", "-u", "/janitor.py"]
    environment:
      TZ: Europe/Stockholm
      QBT_URL: http://127.0.0.1:8080
      SEERR_URL: http://192.168.50.254:35055
      JANITOR_ON_UPGRADE: "false"   # replaced-by-upgrade torrents keep seeding
      JANITOR_DRY_RUN: "false"
    volumes:
      - /volume2/nas-apps/media-janitor/janitor.py:/janitor.py:ro
      - /volume2/nas-apps/radarr/config/config.xml:/keys/radarr.xml:ro
      - /volume2/nas-apps/sonarr/config/config.xml:/keys/sonarr.xml:ro
      - /volume2/nas-apps/seerr/settings.json:/keys/seerr.json:ro
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped

networks:
  starrs:
    external: true
