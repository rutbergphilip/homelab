# LAN/tailnet only. NOT on the public internet, and deliberately not gated by
# Authentik either — the point is that this host is simply not routable from
# outside.
#
# Why: the upstream image is dead. zadam/trilium:latest resolves to 0.63.7,
# published 2024-05-30, and the project moved to TriliumNext. Two years of
# unpatched Node had been answering the open internet behind nothing but
# Trilium's own password.
#
# Forward-auth was the first attempt (2026-09-18) and is not used, because the
# Authentik blueprint that defines the provider could not be applied — see
# kubernetes/apps/security/authentik/. Network reachability is the stronger
# control anyway: with the `internal` class there is no path from the internet
# at all, rather than a path guarded by a redirect.
#
# Access from away is via Tailscale: the subnet routers advertise
# 192.168.50.0/24 and the tailnet pushes split DNS for rutberg.dev, so this
# host resolves and works from a phone or laptop anywhere.
#
# external-dns only publishes the `external` class, so moving to `internal`
# also withdraws the public DNS record (policy: sync). k8s-gateway resolves it
# for LAN/tailnet clients, and the internal controller serves the same wildcard
# certificate, so https keeps working.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trilium
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: internal
  rules:
    - host: notes.rutberg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trilium
                port:
                  number: 8080
