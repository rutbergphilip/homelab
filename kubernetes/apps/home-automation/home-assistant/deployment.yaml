apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant

spec:
  # hostNetwork + single replica: RollingUpdate's surge pod would either wedge
  # on the same node's occupied host port or hop nodes and change the LAN IP
  # under HomeKit's mDNS identity. Recreate avoids both.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant

    spec:
      # LAN-native networking: HomeKit bridge pairing + mDNS/zeroconf discovery
      # (and future Matter) need the node's LAN presence — pod-network mDNS
      # never reaches the LAN. ClusterFirstWithHostNet keeps cluster DNS
      # working (kcal REST sensors resolve *.svc.cluster.local).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: install-hacs
          image: homeassistant/home-assistant:2026.8.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              if [ ! -f /config/custom_components/hacs/manifest.json ]; then
                wget -qO - https://get.hacs.xyz | bash -
              else
                echo "HACS already installed, skipping."
              fi

          volumeMounts:
            - name: homelab-storage
              mountPath: /config
              subPath: home-assistant/config

      containers:
        - name: home-assistant
          image: homeassistant/home-assistant:2026.8.1
          imagePullPolicy: Always

          # Raised from 800Mi/500m on 2026-07-26 after an OOMKill (exit 137).
          # The Oura integration added 71 entities plus a rolling statistics
          # import on top of an instance that was already restarting daily, and
          # 800Mi left no headroom. CPU raised too: the container was pinned at
          # its 500m ceiling during startup, which is what makes boot slow enough
          # for the ingress to serve 502s.
          resources:
            limits:
              memory: 1536Mi
              cpu: "2"
            requests:
              memory: 640Mi
              cpu: 300m

          ports:
            - containerPort: 8123
              name: home-assistant

          volumeMounts:
            - name: homelab-storage
              mountPath: /config
              subPath: home-assistant/config

      volumes:
        - name: homelab-storage
          persistentVolumeClaim:
            claimName: homelab-nfs-pvc
