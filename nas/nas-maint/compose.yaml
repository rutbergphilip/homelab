# nas/nas-maint/compose.yaml — maintenance shell on the Ugreen NAS.
# Not a service: an idle Alpine box with the app-config shares mounted, used
# through the UGOS container Terminal for backups, migrations and inspection
# (UGOS has no SSH). Keep it STOPPED when not in use — while it runs it holds
# the mounted shared folders open (blocks renaming/moving them).
name: nas-maint

# Bounded container logs (docker default is unlimited json-file on the SSD volume).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  shell:
    image: alpine:3.22
    container_name: nas-maint
    command: ["sleep", "infinity"]
    volumes:
      - /volume2/nas-apps:/nas-apps
      - /volume1/nas-apps-backup:/nas-apps-backup
    logging: *logging
    restart: "no"
