# Serves /outpost.goauthentik.io/* on crafty.rutberg.dev (login redirect,
# callback, auth endpoint) by proxying to the Authentik embedded outpost. NO
# forward-auth here — this IS the auth handshake. upstream-vhost keeps
# Host: crafty.rutberg.dev so the outpost matches the crafty provider.
# Backend: the authentik-embedded-outpost ExternalName Service defined in
# ../claude-db/service-outpost.yaml (namespace-wide, shared by all
# forward-auth apps in default).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crafty-outpost
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.rutberg.dev"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/upstream-vhost: "crafty.rutberg.dev"
spec:
  ingressClassName: external
  rules:
    - host: crafty.rutberg.dev
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-embedded-outpost
                port:
                  number: 80
