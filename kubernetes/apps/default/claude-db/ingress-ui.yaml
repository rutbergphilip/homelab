# Second Ingress on the SAME host, scoped to /ui + /api only, gated by
# Authentik forward-auth (single-application pattern cloned from
# kcal-assistant). nginx longest-prefix routing sends /ui* and /api* here
# (authenticated) while /mcp and /healthz stay on the open claude-db Ingress
# (path /). This split is load-bearing: nginx auth annotations are
# per-location, so gating must never be applied to the / Ingress or the
# claude.ai MCP connector (which cannot do interactive login) would break.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-db-ui
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.rutberg.dev"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production"

    # Authentik forward-auth. On success the outpost returns X-authentik-*
    # headers; auth-response-headers copies them onto the upstream request via
    # proxy_set_header, which REPLACES any client-supplied value — so a browser
    # cannot forge X-authentik-username from outside. The server re-checks the
    # header as defense in depth (src/ui/routes.ts).
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-server.security.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://claude.rutberg.dev/outpost.goauthentik.io/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

spec:
  ingressClassName: external
  rules:
    - host: claude.rutberg.dev
      http:
        paths:
          - path: /ui
            pathType: Prefix
            backend:
              service:
                name: claude-db
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: claude-db
                port:
                  number: 3000
