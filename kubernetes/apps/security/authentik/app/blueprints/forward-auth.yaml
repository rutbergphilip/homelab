  # ------------------------------------------------------------ grafana ----
  # Grafana (observability namespace) had only the local admin login (the generic
  # OAuth secret was a placeholder). Gated 2026-09-12 so grafana.rutberg.dev signs in
  # with Authentik like everything else; Grafana trusts the X-authentik-username
  # header the ingress sets after this provider says yes (GF_AUTH_PROXY_*).
  - model: authentik_providers_proxy.proxyprovider
    state: present
    id: grafana-provider
    identifiers:
      name: grafana
    attrs:
      mode: forward_single
      external_host: https://grafana.rutberg.dev
