apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  labels:
    app: trilium

spec:
  replicas: 1
  selector:
    matchLabels:
      app: trilium
  template:
    metadata:
      labels:
        app: trilium

    spec:
      containers:
        - name: trilium
          # renovate: datasource=docker depName=zadam/trilium
          # NOTE: upstream is dead — 0.63.7 (2024-05-30) is the final zadam
          # release. Successor is TriliumNext (triliumnext/notes). Pinning
          # here only stops silent drift; migration is the real fix.
          image: zadam/trilium:0.63.7
          imagePullPolicy: IfNotPresent

          resources:
            limits:
              memory: 512Mi
              cpu: 300m
            requests:
              memory: 256Mi
              cpu: 100m

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: TRILIUM_DATA_DIR
              value: /data
            - name: TRILIUM_PORT
              value: "8080"

          volumeMounts:
            - name: homelab-storage
              mountPath: /data
              subPath: trilium/data

      volumes:
        - name: homelab-storage
          persistentVolumeClaim:
            claimName: homelab-nfs-pvc
