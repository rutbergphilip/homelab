# Scrape targets on the Ugreen NAS (192.168.50.254): the nas-metrics compose project
# (nas/nas-metrics) publishes node-exporter on :39100 and cAdvisor on :39080.
# Service-without-selector + Endpoints is the same trick the home-automation
# ingresses use to point at the NAS; the ServiceMonitors pick them up by label.
# NOTE: the label key is custom on purpose — the Flux Kustomization stamps
# app.kubernetes.io/name=kube-prometheus-stack on every object here (commonMetadata),
# which would overwrite that key and break the selector.
---
apiVersion: v1
kind: Service
metadata:
  name: nas-node-exporter
  labels:
    nas.rutberg.dev/target: nas-node-exporter
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 39100
      targetPort: 39100
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: nas-node-exporter
  labels:
    nas.rutberg.dev/target: nas-node-exporter
subsets:
  - addresses:
      - ip: 192.168.50.254
    ports:
      - name: metrics
        port: 39100
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nas-node-exporter
spec:
  jobLabel: nas.rutberg.dev/target
  selector:
    matchLabels:
      nas.rutberg.dev/target: nas-node-exporter
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: instance
          replacement: ugreen-nas
        - targetLabel: nodename
          replacement: ugreen-nas
---
apiVersion: v1
kind: Service
metadata:
  name: nas-cadvisor
  labels:
    nas.rutberg.dev/target: nas-cadvisor
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 39080
      targetPort: 39080
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: nas-cadvisor
  labels:
    nas.rutberg.dev/target: nas-cadvisor
subsets:
  - addresses:
      - ip: 192.168.50.254
    ports:
      - name: metrics
        port: 39080
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nas-cadvisor
spec:
  jobLabel: nas.rutberg.dev/target
  selector:
    matchLabels:
      nas.rutberg.dev/target: nas-cadvisor
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 15s
      relabelings:
        - targetLabel: instance
          replacement: ugreen-nas
      metricRelabelings:
        # Only named docker containers; drop the cgroup-root and per-interface noise.
        # An empty regex means "default (.*)" to Prometheus and dropped EVERYTHING
        # (2026-09-11 evening: no container metrics for 12 h, NasContainerMissing spam).
        - sourceLabels: [name]
          regex: "^$"
          action: drop
        - sourceLabels: [__name__]
          regex: container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|memory_failures_total|blkio_device_usage_total)
          action: drop
