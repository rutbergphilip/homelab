# Crafty Controller — web panel for the Minecraft server(s).
#
# Why this panel and not AMP/Pterodactyl/Pelican: those spawn each game
# server as a *sibling container*, so their daemon needs the Docker socket.
# Crafty runs servers as child processes inside its own container, which
# makes it one ordinary Deployment with no privileged escape hatch. The
# itzg/minecraft-server Deployment this replaces lives on in git history
# (kubernetes/apps/default/minecraft, removed 2026-09-19).
#
# Runs as uid 1000 / gid 0 on purpose. Crafty's launcher has two paths:
# root (chgrp/chmod sweeps, then `sudo -u crafty`) and non-root ("likely
# Kubernetes", plain exec). The NFS export forces every file to 1000:10 mode
# 0777 whoever writes it, so the root path's permission repair would only
# spam EPERM; the non-root path is the one designed for this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crafty
  namespace: default
  labels:
    app: crafty
spec:
  replicas: 1
  # Recreate, never RollingUpdate: two Crafty instances would both try to
  # run the same server processes against the same world directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crafty
  template:
    metadata:
      labels:
        app: crafty
      annotations:
        # Restart the pod when the tailscale login key lands or changes, so the
        # sidecar picks it up without anyone touching kubectl.
        secret.reloader.stakater.com/reload: tailscale-minecraft-auth
    spec:
      serviceAccountName: crafty
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: crafty
          # renovate: datasource=docker depName=registry.gitlab.com/crafty-controller/crafty-4
          # Ships OpenJDK 8/11/17/21/25 — 25 is what Minecraft 26.x needs.
          image: registry.gitlab.com/crafty-controller/crafty-4:4.11.0

          ports:
            - name: https-ui
              containerPort: 8443
              protocol: TCP
            # One Minecraft server for now, on the vanilla port. A second
            # server needs a second port here and on the game Service.
            - name: minecraft
              containerPort: 25565
              protocol: TCP

          env:
            - name: TZ
              value: "Europe/Stockholm"

          # The panel serves HTTPS with a self-signed cert; kubelet does not
          # verify it. /login answers 200 without a session. Startup is slow
          # the first time (config seeding + DB migrations).
          startupProbe:
            httpGet:
              path: /login
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /login
              port: 8443
              scheme: HTTPS
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /login
              port: 8443
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

          # The Minecraft JVM runs *inside* this container, so the limit has
          # to cover the panel plus every server's heap plus JVM overhead.
          # One server at 4G heap fits comfortably; raise this before
          # raising a server's max memory in the panel.
          resources:
            requests:
              memory: 3Gi
              cpu: "1"
            limits:
              memory: 8Gi
              cpu: "4"

          volumeMounts:
            - name: homelab-storage
              mountPath: /crafty/app/config
              subPath: crafty/config
            - name: homelab-storage
              mountPath: /crafty/servers
              subPath: crafty/servers
            - name: homelab-storage
              mountPath: /crafty/backups
              subPath: crafty/backups
            - name: homelab-storage
              mountPath: /crafty/logs
              subPath: crafty/logs
            - name: homelab-storage
              mountPath: /crafty/import
              subPath: crafty/import
            # The world from the previous itzg Deployment, exposed to the
            # panel's "import existing server" as /crafty/import/vanilla.
            # Read-only: the import *copies* into /crafty/servers/<id>/, and
            # this original stays untouched as a fallback. Safe to drop once
            # the imported server has been confirmed working.
            - name: homelab-storage
              mountPath: /crafty/import/vanilla
              subPath: minecraft/data
              readOnly: true

        # Tailscale sidecar: makes the game server its own tailnet node
        # ("minecraft") so it can be SHARED with friends' tailnets — the only
        # zero-exposure way to let people outside the house join. Tagged nodes
        # cannot be shared, so this logs in as Philip's user with a personal
        # auth key (Secret tailscale-minecraft-auth, written by
        # scripts/tailscale-minecraft-secret.sh); node key expiry is disabled
        # by that script afterwards, so nothing here expires.
        #
        # Userspace mode: no TUN, no NET_ADMIN. Inbound connections to the
        # node's 100.x address are forwarded by tailscaled to the same port on
        # 127.0.0.1 — which, in this pod, is the Minecraft server.
        #
        # Deliberately NO probes and a restart loop instead of a bare
        # containerboot: every container in a pod must be Ready for the pod to
        # be Ready, and this pod backs the game LoadBalancer. A crashing or
        # logged-out sidecar must never take the server off the LAN.
        - name: tailscale
          # renovate: datasource=docker depName=ghcr.io/tailscale/tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                /usr/local/bin/containerboot
                echo "tailscale sidecar exited (rc=$?); retrying in 60s"
                sleep 60
              done
          env:
            - name: TS_HOSTNAME
              value: "minecraft"
            - name: TS_USERSPACE
              value: "true"
            - name: TS_KUBE_SECRET
              value: "tailscale-minecraft-state"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-minecraft-auth
                  key: TS_AUTHKEY
                  # Optional so the pod starts before the key exists; the
                  # sidecar just idles logged-out until reloader restarts it.
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: ts-tmp
              mountPath: /tmp
            - name: ts-run
              mountPath: /var/run/tailscale
            - name: ts-state
              mountPath: /var/lib/tailscale

      # Long enough for Crafty to stop the Minecraft server gracefully
      # (it issues `stop`, waits for the world to flush) before SIGKILL.
      terminationGracePeriodSeconds: 180

      volumes:
        - name: homelab-storage
          persistentVolumeClaim:
            claimName: homelab-nfs-pvc
        - name: ts-tmp
          emptyDir: {}
        - name: ts-run
          emptyDir: {}
        - name: ts-state
          emptyDir: {}
