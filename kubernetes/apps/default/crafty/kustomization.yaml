---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
  # secret.sops.yaml is deliberately NOT listed: it is a git-only record of
  # the panel password (decrypt with sops). Nothing in the cluster consumes it,
  # so applying it would only make the password readable to anything with
  # Secret access in this namespace.
  - ./deployment.yaml
  - ./service.yaml
  - ./ingress.yaml
  - ./ingress-outpost.yaml
