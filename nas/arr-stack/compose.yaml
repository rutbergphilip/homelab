# nas/arr-stack/compose.yaml
# Deployed as UGOS Docker "Project" arr-stack on the Ugreen NAS (192.168.50.254).
# Replaces the four hand-made containers (sonarr, radarr, prowlarr, seerr) with
# the SAME container names, ports, mounts and env — captured from their UGOS
# exports on 2026-09-07 — but with /config on the SSD volume (/volume2/nas-apps).
# Cluster ingresses (kubernetes/apps/home-automation/arr-stack) proxy to the
# host ports below; qBittorrent is torrent-vpn (nas/torrent-vpn), Jellyfin is
# nas/jellyfin. Everything shares the docker bridge network `starrs`.
name: arr-stack

# Bounded container logs (docker default is unlimited json-file on the SSD volume).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-lsio-env: &lsio-env
  TZ: Europe/Stockholm
  PUID: "1000"
  PGID: "1000"   # as the old containers had it (UGOS itself suggests 10; kept for continuity)

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    networks: [starrs]
    ports:
      - "38989:8989"
    environment:
      <<: *lsio-env
    volumes:
      - /volume2/nas-apps/sonarr/config:/config
      # One /data root (TRaSH layout) so torrents → media imports are hardlinks,
      # not copies. Root folder = /data/media/series; qBittorrent's /torrents is
      # reached via a Sonarr remote path mapping to /data/torrents. The legacy
      # /series, /movies, /torrents binds were dropped 2026-09-11 after Radarr's
      # imports since 09-07 all landed under /data/media (hardlinks confirmed).
      - /volume1/homelab/streaming:/data
    mem_limit: 3g
    logging: *logging
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    networks: [starrs]
    ports:
      - "37878:7878"
    environment:
      <<: *lsio-env
    volumes:
      - /volume2/nas-apps/radarr/config:/config
      - /volume1/homelab/streaming:/data   # see sonarr; root folder /data/media/movies
    mem_limit: 3g
    logging: *logging
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    networks: [starrs]
    ports:
      - "39696:9696"
    environment:
      <<: *lsio-env
    volumes:
      - /volume2/nas-apps/prowlarr/config:/config
    mem_limit: 3g
    logging: *logging
    restart: always

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1  # DB schema already at 3.4 (AddIgnoreQuota… migration applied); 3.2.0 fails on user_settings.discordIds
    container_name: seerr
    networks: [starrs]
    ports:
      - "35055:5055"
    environment:
      TZ: Europe/Stockholm
      PUID: "1000"
      PGID: "10"
    volumes:
      - /volume2/nas-apps/seerr:/app/config
    logging: *logging
    restart: always

  # TRaSH guide sync (quality definitions, WEB-1080p / HD Bluray+WEB profiles, custom
  # formats) into Sonarr + Radarr, daily 05:00. Config: recyclarr/recyclarr.yml (git
  # copy has placeholders; the live file on the NAS carries the arr API keys and is
  # generated from their config.xml in the nas-maint shell). Additive only — see the
  # policy note in the config file. Added 2026-09-11.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    networks: [starrs]
    # root, not 1000: UGOS enforces shared-folder permissions in the kernel per uid —
    # on this NAS uid 1000 and 65534 are denied on /volume2/nas-apps even with mode
    # 777 (root, 10, 1001 pass). Same reason nas-metrics' node-exporter runs as root.
    user: "0:0"
    environment:
      TZ: Europe/Stockholm
      CRON_SCHEDULE: "0 5 * * *"
    volumes:
      - /volume2/nas-apps/recyclarr:/config
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  # Unpackerr (added 2026-09-12): Sonarr/Radarr cannot import rar-packed releases, so
  # every such torrent sat in the queue as "manual import required" (only the sample
  # .mkv was visible) and re-alerted the phone on each arr restart. Unpackerr polls the
  # arr queues, extracts archives inside the download folder (same /data view as the
  # arrs, so queue paths match), the arr then imports the extracted file as a hardlink;
  # the rar volumes stay for seeding, the extracted copy is removed 10 min after import.
  # API keys: the git copy carries REPLACE_ON_NAS; the live project on the NAS has the
  # real keys (config.xml of each arr), pasted in the UGOS editor — keys never go in git.
  unpackerr:
    image: golift/unpackerr:0.16.1
    container_name: unpackerr
    networks: [starrs]
    user: "1000:1000"   # same uid as the arrs / qBittorrent → extracted files import cleanly
    environment:
      TZ: Europe/Stockholm
      UN_DEBUG: "false"
      UN_INTERVAL: 2m
      UN_START_DELAY: 1m
      UN_RETRY_DELAY: 5m
      UN_MAX_RETRIES: "3"
      UN_PARALLEL: "1"
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: REPLACE_ON_NAS
      UN_SONARR_0_PATHS_0: /data/torrents
      UN_SONARR_0_PROTOCOLS: torrent
      UN_SONARR_0_DELETE_DELAY: 10m
      UN_SONARR_0_DELETE_ORIG: "false"
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: REPLACE_ON_NAS
      UN_RADARR_0_PATHS_0: /data/torrents
      UN_RADARR_0_PROTOCOLS: torrent
      UN_RADARR_0_DELETE_DELAY: 10m
      UN_RADARR_0_DELETE_ORIG: "false"
    volumes:
      - /volume1/homelab/streaming:/data
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

networks:
  starrs:
    external: true
