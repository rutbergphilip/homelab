# The tailscale sidecar in the crafty pod keeps its node identity in a Secret
# (TS_KUBE_SECRET) rather than on the NFS share, where every file is 1000:10
# mode 0777 and readable by anything that mounts the PVC. Same shape as the
# homelab-k8s subnet router (network/tailscale/app/rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crafty
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crafty-tailscale
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-minecraft-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crafty-tailscale
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crafty-tailscale
subjects:
  - kind: ServiceAccount
    name: crafty
