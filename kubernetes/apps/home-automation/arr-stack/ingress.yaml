# Public, un-gated: Seerr is the user-facing request app (household accounts,
# authenticates against Jellyfin itself). The admin UIs live in ingress-admin.yaml
# behind Authentik forward-auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arr-stack-ingress
  namespace: home-automation
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.rutberg.dev"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production"

spec:
  ingressClassName: external

  tls:
    - hosts:
        - jellyseerr.rutberg.dev
      secretName: jellyseerr-tls

  rules:
    - host: jellyseerr.rutberg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ugreen-nas-jellyseerr
                port:
                  number: 35055
