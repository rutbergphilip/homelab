# Gated by Authentik forward-auth (single-application pattern — see
# kcal-assistant and SETUP-GUIDE.md in security/authentik). The auth handshake
# itself is served on this same host by ingress-outpost.yaml. Crafty then has
# its own login on top; two logins for the thing that hands out server
# consoles is the right amount.
#
# Crafty only speaks HTTPS (self-signed) on 8443, hence backend-protocol.
# The console is a websocket; the long read timeout keeps it open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crafty
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.rutberg.dev"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-server.security.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://crafty.rutberg.dev/outpost.goauthentik.io/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
spec:
  ingressClassName: external
  rules:
    - host: crafty.rutberg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crafty
                port:
                  number: 8443
