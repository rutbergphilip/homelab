# Sonarr / Radarr / Prowlarr behind Authentik forward-auth (single-application
# pattern, same as qbittorrent). One Ingress serves all three hosts: the auth-signin
# URL uses $host so each host keeps its own outpost handshake (ingress-outpost.yaml)
# and session cookie. The arr apps keep their own login as the second lock.
# Seerr and Prowlarr reach the arrs over the NAS docker network, never through here.
# Added 2026-09-11.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arr-stack-admin
  namespace: home-automation
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.rutberg.dev"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    # Authentik forward authentication
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-server.security.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/outpost.goauthentik.io/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Prowlarr indexer/backup imports and arr manual imports post larger bodies.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"

spec:
  ingressClassName: external

  tls:
    - hosts:
        - sonarr.rutberg.dev
      secretName: sonarr-tls
    - hosts:
        - radarr.rutberg.dev
      secretName: radarr-tls
    - hosts:
        - prowlarr.rutberg.dev
      secretName: prowlarr-tls

  rules:
    - host: sonarr.rutberg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ugreen-nas-sonarr
                port:
                  number: 38989
    - host: radarr.rutberg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ugreen-nas-radarr
                port:
                  number: 37878
    - host: prowlarr.rutberg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ugreen-nas-prowlarr
                port:
                  number: 39696
