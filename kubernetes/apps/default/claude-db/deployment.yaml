kind: Deployment
apiVersion: apps/v1
metadata:
  name: claude-db
  labels:
    app: claude-db

spec:
  replicas: 1
  # SQLite on NFS tolerates exactly one writer process; never run two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-db
  template:
    metadata:
      labels:
        app: claude-db

    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: claude-db
          image: rutbergphilip/claude-db:v0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: TZ
              value: "Europe/Stockholm"
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: "/app/data/claude.db"
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-db-secrets
                  key: MCP_TOKEN

          volumeMounts:
            - name: homelab-storage
              mountPath: /app/data
              subPath: claude-db/data

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

      volumes:
        - name: homelab-storage
          persistentVolumeClaim:
            claimName: homelab-nfs-pvc
